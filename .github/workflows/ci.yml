name: C++20 CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Windows C++20 Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MinGW-w64 GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      - name: Add UCRT64 to PATH
        run: echo "C:/msys64/ucrt64/bin" >> $env:GITHUB_PATH

      - name: Verify Toolchain
        run: |
          g++ --version
          windres --version

      - name: Compile Core Test Suite
        run: |
          mkdir -p bin
          g++ -std=c++20 -O3 -mavx2 -mfma -mpopcnt -Wall -Wextra tests/test_core.cpp -I src -o bin/test_core.exe

      - name: Run Core Test Suite
        run: |
          ./bin/test_core.exe

      - name: Compile Windows Resources
        run: |
          windres src/app/resources.rc -O coff -o bin/resources.res

      - name: Compile Native HoDoKu GUI Application
        run: |
          g++ -std=c++20 -O3 -mavx2 -mfma -mpopcnt -Wall -Wextra -static-libgcc -static-libstdc++ src/app/main.cpp bin/resources.res -I src -lgdiplus -lcomctl32 -lgdi32 -luser32 -lcomdlg32 -o bin/hodoku_native.exe

      - name: Compile and Run Extended Tests
        run: |
          g++ -std=c++20 -O3 -mavx2 -mfma -mpopcnt -Wall -Wextra -static-libgcc -static-libstdc++ tests/test_file_io.cpp -I src -lgdiplus -lcomctl32 -lgdi32 -luser32 -lcomdlg32 -o bin/test_file_io.exe
          ./bin/test_file_io.exe
          g++ -std=c++20 -O3 -mavx2 -mfma -mpopcnt -Wall -Wextra -static-libgcc -static-libstdc++ tests/test_tutor.cpp -I src -lgdiplus -lcomctl32 -lgdi32 -luser32 -lcomdlg32 -o bin/test_tutor.exe
          ./bin/test_tutor.exe

